name: Dhole Reports CI

on:
  pull_request:
    branches: [develop]

permissions:
  contents: read
  packages: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    # Reports integration tests use a real PostgreSQL Outbox transaction.
    # Match the successful F6 isolated workflow instead of skipping that test.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: reports_f6_ci
          POSTGRES_PASSWORD: ci_only_not_for_production
          POSTGRES_DB: dhole_reports_f6
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U reports_f6_ci -d dhole_reports_f6"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      REPORTS_F6_POSTGRES: Host=127.0.0.1;Port=5432;Database=dhole_reports_f6;Username=reports_f6_ci;Password=ci_only_not_for_production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Authenticate GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet nuget update source github --username "$GITHUB_ACTOR" --password "$GITHUB_TOKEN" --store-password-in-clear-text --configfile NuGet.Config
      - name: Restore
        run: dotnet restore DholeReportsService.slnx --configfile NuGet.Config
      - name: Build
        run: dotnet build DholeReportsService.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test DholeReportsService.slnx --configuration Release --no-build --verbosity normal
