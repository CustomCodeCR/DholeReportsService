name: Deploy Dhole Reports

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dhole-reports-deploy
  cancel-in-progress: true

env:
  COMPOSE_FILE: .dhole-system/deploy/docker-compose.services.yml

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, dhole]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: CustomCodeCR/DholeSystem
          ref: main
          path: .dhole-system
      - name: Verify server
        run: |
          set -euo pipefail
          docker version
          docker compose version
          docker network inspect dhole >/dev/null
          test -f /opt/dhole/.env
          docker compose --env-file /opt/dhole/.env -f "$COMPOSE_FILE" config -q
      - name: Build images
        run: |
          set -euo pipefail
          SHA_TAG="${GITHUB_SHA::12}"
          docker build --pull -f src/Dhole.Reports.Api/Dockerfile -t dhole/reports-api:latest -t "dhole/reports-api:$SHA_TAG" .
          docker build --pull -f src/Dhole.Reports.Workers/Dockerfile -t dhole/reports-workers:latest -t "dhole/reports-workers:$SHA_TAG" .
      - name: Deploy Reports
        run: |
          set -euo pipefail
          docker compose --env-file /opt/dhole/.env -f "$COMPOSE_FILE" up -d --no-deps --force-recreate --pull never reports-api reports-workers
          docker compose --env-file /opt/dhole/.env -f "$COMPOSE_FILE" ps reports-api reports-workers
      - name: Cleanup old images
        run: docker image prune -f
