# One-shot workflow; removes itself after patching the migration.
name: Fix pricing template migration raw string

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/fix-pricing-template-migration-indent.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix migration raw string indentation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/Dhole.Reports.Persistence/Migrations/20260827234500_UpdatePricingFclClientQuoteTemplateLayout.cs')
          text = path.read_text(encoding='utf-8')
          start_marker = 'html_content = $html$\n'
          end_marker = '\n                $html$,'
          if start_marker not in text or end_marker not in text:
              raise SystemExit('No se encontró el bloque HTML de la migración.')
          prefix, remainder = text.split(start_marker, 1)
          html, suffix = remainder.split(end_marker, 1)
          html = '\n'.join(('            ' + line) if line else '            ' for line in html.split('\n'))
          path.write_text(prefix + start_marker + html + end_marker + suffix, encoding='utf-8')
          PY

      - name: Commit fix and cleanup helper
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-pricing-template-migration-indent.yml
          rm -f .github/scripts/fix-pricing-template-migration-indent.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(reports): compile requested pricing template migration'
          git push origin HEAD:master
